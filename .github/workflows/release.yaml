name: Release Tags

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      supabase_schema_changed: ${{ steps.detect.outputs.supabase_schema_changed }}
      supabase_schema_version_changed: ${{ steps.detect.outputs.supabase_schema_version_changed }}
      supabase_schema_version: ${{ steps.detect.outputs.supabase_schema_version }}
      supabase_schema_tag: ${{ steps.detect.outputs.supabase_schema_tag }}
      supabase_schema_generator_changed: ${{ steps.detect.outputs.supabase_schema_generator_changed }}
      supabase_schema_generator_version_changed: ${{ steps.detect.outputs.supabase_schema_generator_version_changed }}
      supabase_schema_generator_version: ${{ steps.detect.outputs.supabase_schema_generator_version }}
      supabase_schema_generator_tag: ${{ steps.detect.outputs.supabase_schema_generator_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package version changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          detect_package() {
            local package="$1"
            local changed version previous_version version_changed

            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- "$package"; then
              changed=false
            else
              changed=true
            fi

            version="$(awk '/^version:/{print $2; exit}' "$package/pubspec.yaml")"
            previous_version="$(git show "$BEFORE_SHA:$package/pubspec.yaml" 2>/dev/null | awk '/^version:/{print $2; exit}' || true)"

            version_changed=false
            if [ -z "$previous_version" ] || [ "$version" != "$previous_version" ]; then
              version_changed=true
            fi

            if [ "$changed" = true ] && [ "$version_changed" = false ]; then
              echo "::error title=Version bump required::$package changed on main, but version stayed at $version."
              exit 1
            fi

            echo "${package}_changed=$changed" >> "$GITHUB_OUTPUT"
            echo "${package}_version_changed=$version_changed" >> "$GITHUB_OUTPUT"
            echo "${package}_version=$version" >> "$GITHUB_OUTPUT"
            echo "${package}_tag=${package}-v${version}" >> "$GITHUB_OUTPUT"
          }

          detect_package supabase_schema
          detect_package supabase_schema_generator

  validate_supabase_schema:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.supabase_schema_version_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Validate publishable package
        working-directory: supabase_schema
        run: dart pub publish --dry-run

  validate_supabase_schema_generator:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.supabase_schema_generator_version_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Validate publishable package
        working-directory: supabase_schema_generator
        run: dart pub publish --dry-run

  release_supabase_schema:
    runs-on: ubuntu-latest
    needs:
      - detect
      - validate_supabase_schema
    if: needs.detect.outputs.supabase_schema_version_changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error title=Missing secret::Add a RELEASE_TAG_TOKEN secret with permission to push tags."
            exit 1
          fi

      - name: Create and push package tag
        id: tag
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          RELEASE_TAG: ${{ needs.detect.outputs.supabase_schema_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git remote set-url origin "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$RELEASE_TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: supabase_schema v${{ needs.detect.outputs.supabase_schema_version }}
          body: |
            Automated release for `supabase_schema` version `${{ needs.detect.outputs.supabase_schema_version }}`.

            See `supabase_schema/CHANGELOG.md` for package-specific changes.

  release_supabase_schema_generator:
    runs-on: ubuntu-latest
    needs:
      - detect
      - validate_supabase_schema_generator
    if: needs.detect.outputs.supabase_schema_generator_version_changed == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require release tag token
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error title=Missing secret::Add a RELEASE_TAG_TOKEN secret with permission to push tags."
            exit 1
          fi

      - name: Create and push package tag
        id: tag
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
          RELEASE_TAG: ${{ needs.detect.outputs.supabase_schema_generator_tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --tags
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          git remote set-url origin "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$RELEASE_TAG"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: supabase_schema_generator v${{ needs.detect.outputs.supabase_schema_generator_version }}
          body: |
            Automated release for `supabase_schema_generator` version `${{ needs.detect.outputs.supabase_schema_generator_version }}`.

            See `supabase_schema_generator/CHANGELOG.md` for package-specific changes.
